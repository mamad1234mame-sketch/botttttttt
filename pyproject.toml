[project]
name = "bio-ai-channel"
version = "1.0.0"
description = "Self-hosted Telegram science publisher (AI x Biology) powered by Gemini + GitHub Actions"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=2.22.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bioai_channel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
