name: ci

on:
  push:
    branches: [main]
    # کامیت‌های خودکار state نباید CI را بیدار کنند
    paths-ignore:
      - "state/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "state/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (compile all modules)
        run: python -m compileall -q bioai_channel tests

      - name: No secrets in the repo
        run: |
          python - <<'PY'
          import pathlib, re, sys
          patterns = [
              (r"\b\d{8,10}:AA[0-9A-Za-z_-]{30,}", "Telegram bot token"),
              (r"\bAIza[0-9A-Za-z_-]{30,}", "Google API key"),
              (r"\bAQ\.[0-9A-Za-z_-]{30,}", "Google OAuth-style token"),
              (r"ghp_[0-9A-Za-z]{30,}", "GitHub personal token"),
          ]
          bad = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in {".git", ".venv", "node_modules"} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern, label in patterns:
                  if re.search(pattern, text):
                      bad.append(f"{path}: {label}")
          if bad:
              print("❌ secret پیدا شد:\n" + "\n".join(bad))
              sys.exit(1)
          print("✅ هیچ secret ای در ریپو نیست")
          PY

      - name: Validate workflow files
        run: python tests/test_workflows.py

      - name: Pytest
        run: pytest -v --maxfail=1
