name: post

# هر ۳ ساعت یک پست. برای هر ساعت: cron را به '5 */1 * * *' تغییر بده.
# نکته: cron گیتهاب UTC است، و اجرا فقط از برنچ پیش‌فرض (main) trigger می‌شود.

on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "قالب اجباری (خالی = انتخاب هوشمند)"
        required: false
        type: choice
        options:
          - ""
          - breaking
          - deepdive
          - fact
          - joke
          - toolbox
          - lab_watch
          - on_this_day
          - myth
          - explain_like
          - behind_the_paper
          - debate
          - career
          - dataset
          - method_watch
          - frontier
      dry_run:
        description: "فقط تست کن، چیزی به کانال نفرست"
        required: false
        type: boolean
        default: false
      skip_image:
        description: "تصویر تولید نکن"
        required: false
        type: boolean
        default: false

# هرگز دو اجرا همزمان روی کانال نروند.
concurrency:
  group: publish-post
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # تاخیر تصادفی تا همهٔ ربات‌های دنیا رأس ساعت به API نزنند
      # و الگوی انتشار کانال طبیعی‌تر به نظر برسد.
      - name: Random jitter (0-20 min)
        run: |
          DELAY=$((RANDOM % 1200))
          echo "sleeping ${DELAY}s"
          sleep "$DELAY"

      - name: Publish post
        id: publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_SIGNATURE: ${{ vars.CHANNEL_SIGNATURE || '@Bio_with_AI' }}
          STATE_PATH: state/memory.json
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SKIP_IMAGES: ${{ inputs.skip_image && 'true' || 'false' }}
        run: |
          ARGS="--state $STATE_PATH"
          if [ -n "${{ inputs.format }}" ]; then
            ARGS="$ARGS --format ${{ inputs.format }}"
          fi
          python -m bioai_channel.main $ARGS

      - name: Commit memory (so the next post is not a repeat)
        if: always() && !cancelled() && inputs.dry_run != true
        run: |
          git config user.name  "bio-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/memory.json || true
          if git diff --cached --quiet; then
            echo "no memory changes to commit"
          else
            git commit -m "chore(state): update memory [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Report failure
        if: failure() && !cancelled()
        run: |
          echo "::error::انتشار پست ناموفق بود. جزئیات در لاگ بالا."
